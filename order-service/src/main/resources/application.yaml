# The Spring-side observability settings live here, in the jar. What the OpenTelemetry *agent*
# reads does not: see ../otel-agent.properties, which docker-compose.yaml mounts at /otel and each
# image's ENTRYPOINT points the agent at. See ../docs/zero-code-instrumentation.md.
spring:
  # Fully nested on purpose: the agent's Spring Boot resource provider parses this file itself
  # and its YAML lookup only walks spring -> application -> name. It is only a fallback here,
  # since otel.service.name is set explicitly at startup.
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/postgres
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:password}
  sql.init.mode: always

# The agent writes trace ids into the MDC under trace_id / span_id — note the underscores;
# Boot's own tracing used traceId / spanId. Printing them keeps console output correlated with
# what lands in Tempo and Loki.
logging:
  include-application-name: false
  pattern:
    correlation: "[${spring.application.name:},%X{trace_id:-},%X{span_id:-}] "

# Note what is absent: no management.opentelemetry.*, no management.otlp.*, no management.tracing.*.
# Exporters, endpoints, sampling and the export interval are the agent's job.
management:
  # The agent's Micrometer bridge exports whatever is registered in Micrometer — but Micrometer's
  # @Timed / @Counted aspects only get registered when this is on.
  observations:
    annotations:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name} # common tag on every meter
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    env:
      show-values: ALWAYS

order:
  mystery-box-api-url: ${MYSTERY_BOX_SERVICE_URL:http://localhost:8081}/api
  products:
    - sku: MYSTERY_BOX
      name: Mystery Box
      cost: 49.99
      stock: 13
    - sku: RUBBER-DUCK
      name: Sentient Rubber Duck
      cost: 4.99
      stock: 42
    - sku: FOREVER-PEN
      name: Pen That Never Runs Out (It Does)
      cost: 9.99
      stock: 15
    - sku: ALARM-CLOCK
      name: Alarm Clock That Judges You
      cost: 19.99
      stock: 8
    - sku: UMBRELLA
      name: Umbrella That Inverts in Light Breeze
      cost: 7.49
      stock: 23