<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Arcane Emporium</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header>
  <h1>⚗ The Arcane Emporium</h1>
  <div class="subtitle">Fine enchantments &amp; peculiar goods — est. in an age long forgotten</div>
</header>

<main id="main">
  <section>
    <p class="section-label">Wares &amp; Curiosities</p>
    <div id="products-grid">
      <th:block th:each="p : ${products}">
        <input type="hidden" th:name="${p.sku()}" th:id="'input-' + ${p.sku()}" value="0">
        <div th:class="${p.sku() == 'MYSTERY_BOX' ? 'product-card mystery' : 'product-card'}"
             th:data-name="${p.name()}" th:data-cost="${p.cost()}">
          <div class="product-name" th:text="${p.name()}"></div>
          <div class="product-meta">
            <span class="product-price" th:text="'$' + ${#numbers.formatDecimal(p.cost(), 1, 2)}"></span>
            <span class="product-stock" th:text="${p.sku() == 'MYSTERY_BOX' ? 'One per order' : p.stock() + ' in stock'}"></span>
          </div>
          <div class="qty-control" th:data-sku="${p.sku()}">
            <button type="button" class="qty-btn" th:id="'dec-' + ${p.sku()}"
                    onclick="changeQty(this.closest('.qty-control'), -1)" disabled>&minus;</button>
            <span class="qty-value" th:id="'qty-' + ${p.sku()}">0</span>
            <button type="button" class="qty-btn"
                    onclick="changeQty(this.closest('.qty-control'), 1)">+</button>
          </div>
        </div>
      </th:block>
    </div>
  </section>

  <aside>
    <div id="cart" class="cart-card">
      <h2>Your Satchel</h2>
      <div id="order-lines">
        <p class="empty-hint">Your satchel awaits&hellip;</p>
      </div>
      <div class="cart-total">
        <span>Total</span>
        <span id="total-price">$0.00</span>
      </div>
      <button id="order-btn" disabled onclick="placeOrder()">Complete Purchase</button>
    </div>
  </aside>
</main>

<div id="toast"></div>

<script>
  function changeQty(ctrl, delta) {
    var sku = ctrl.dataset.sku;
    var input = document.getElementById('input-' + sku);
    var val = Math.max(0, (parseInt(input.value) || 0) + delta);
    input.value = val;
    document.getElementById('qty-' + sku).textContent = val;
    document.getElementById('dec-' + sku).disabled = val === 0;
    updateCart();
  }

  function updateCart() {
    var lines = Array.from(document.querySelectorAll('#products-grid .qty-control'))
      .map(function(ctrl) {
        var qty = parseInt(document.getElementById('input-' + ctrl.dataset.sku).value) || 0;
        var card = ctrl.closest('.product-card');
        return { sku: ctrl.dataset.sku, name: card.dataset.name, cost: parseFloat(card.dataset.cost), qty: qty };
      })
      .filter(function(l) { return l.qty > 0; });
    var orderLines = document.getElementById('order-lines');
    orderLines.innerHTML = lines.length === 0
      ? '<p class="empty-hint">Your satchel awaits\u2026</p>'
      : lines.map(function(l) {
          return '<div class="order-line"><span>' + l.name + ' \u00d7 ' + l.qty + '</span>'
               + '<span class="order-line-price">$' + (l.cost * l.qty).toFixed(2) + '</span></div>';
        }).join('');
    var total = lines.reduce(function(s, l) { return s + l.cost * l.qty; }, 0);
    document.getElementById('total-price').textContent = '$' + total.toFixed(2);
    document.getElementById('order-btn').disabled = lines.length === 0;
  }

  function showToast(message, type) {
    var t = document.getElementById('toast');
    t.textContent = message;
    t.className = 'show ' + type;
    setTimeout(function() { t.className = ''; }, 3500);
  }

  async function placeOrder() {
    var btn = document.getElementById('order-btn');
    btn.disabled = true;
    btn.classList.add('loading');
    var lines = Array.from(document.querySelectorAll('#products-grid .qty-control'))
      .map(function(ctrl) { return { sku: ctrl.dataset.sku, quantity: parseInt(document.getElementById('input-' + ctrl.dataset.sku).value) || 0 }; })
      .filter(function(l) { return l.quantity > 0; });
    var res = await fetch('/orders', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(lines) });
    if (res.ok) {
      document.getElementById('main').innerHTML = await res.text();
    } else {
      showToast(res.headers.get('X-Error'), 'error');
      btn.disabled = false;
      btn.classList.remove('loading');
    }
  }
</script>
</body>
</html>
