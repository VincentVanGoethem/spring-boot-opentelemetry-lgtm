<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="success">
  <div class="confirmation-page">

    <div class="confirmation-check">&#x2713;</div>
    <h2 class="confirmation-title">Purchase Sealed</h2>
    <p class="confirmation-subtitle">Your order has been bound to the arcane ledger.</p>

    <div class="order-summary">
      <div th:each="item : ${orderedItems}" class="ordered-item">
        <div class="ordered-item-header">
          <span class="ordered-item-name" th:text="${productNames[item.sku()]}"></span>
          <span class="ordered-item-qty" th:text="'&times; ' + ${item.quantity()}"></span>
        </div>
        <div th:if="${not #lists.isEmpty(item.contents())}" class="mystery-reveal">
          <h3 class="mystery-reveal-title">What Lurks Within&hellip;</h3>
          <div th:each="content, iter : ${item.contents()}" class="content-item"
               th:style="'animation-delay:' + ${iter.index * 0.15} + 's'">
            <div class="content-item-name" th:text="${content.name()}"></div>
            <div class="content-item-desc" th:text="${content.description()}"></div>
          </div>
        </div>
      </div>
    </div>

    <a href="/" class="btn-continue">Return to the Emporium</a>
  </div>
</th:block>

<th:block th:fragment="error"></th:block>

</body>
</html>
