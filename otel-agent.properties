# OpenTelemetry Java agent configuration — shared by both services.
#
# This file replaces everything that used to live in application.yaml under
# management.opentelemetry.*, management.otlp.* and management.tracing.*, plus the two
# OpenTelemetryConfiguration classes. It is mounted read-only at /otel/otel-agent.properties
# by docker-compose.yaml, and each image's ENTRYPOINT points the agent at it with
# -Dotel.javaagent.configuration-file. Edit it and `docker compose restart` — no rebuild.
#
# Where telemetry is *sent* is deliberately not configured here: that is a property of the
# deployment, not of the image, so it stays an OTEL_EXPORTER_OTLP_ENDPOINT variable in
# docker-compose.yaml. Environment variables win over this file.
#
# Not configured because the agent's defaults are already what this demo wants:
#   otel.traces.exporter / otel.metrics.exporter / otel.logs.exporter = otlp
#   otel.exporter.otlp.protocol = http/protobuf
#   otel.traces.sampler = parentbased_always_on  (was management.tracing.sampling.probability: 1.0)
#   otel.service.name — set explicitly in each image's ENTRYPOINT (the agent could fall back to
#                       spring.application.name, but that lives inside the jar)
#
# Full reference: https://opentelemetry.io/docs/zero-code/java/agent/configuration/

# --- Business spans ----------------------------------------------------------------
# The services carry no OpenTelemetry dependency at all — not even the @WithSpan annotation —
# so the spans between the HTTP entry point and the database are declared here instead.
# Syntax: package.Class[method1,method2];package.Class2[method3]
# Spans are named Class.method and are plain INTERNAL spans. Method visibility does not matter:
# the agent weaves the bytecode, so private methods and self-invocation are instrumented too,
# unlike anything that relies on Spring AOP proxies (@Timed, @Observed).
#
# The trade-off: this cannot capture method arguments or return values as span attributes, which
# @SpanAttribute and Span.current().setAttribute() could. That detail lives in the log lines
# instead — the agent stamps trace_id/span_id on every record, so Grafana still correlates them.
#
# Note that this couples the file to method names. Rename a method and its span disappears
# silently; there is no compile-time check the way an annotation would give you.
#
# One list for both services: each agent only instruments the classes it actually loads.
otel.instrumentation.methods.include=\
  com.example.orderservice.OrderService[createOrder,getOrders,processItems,processItem,createMysteryBox];\
  com.example.mysterybox.MysteryBoxService[generateMysteryBox,fetchMysteryBox]

# --- JDBC --------------------------------------------------------------------------
# Note: otel.semconv-stability.opt-in=database does NOT belong here. It is resolved
# before this file is loaded, so it only takes effect as a system property or an
# environment variable — see the -D flag in each service's Dockerfile ENTRYPOINT.
# Without it, JDBC spans carry the old db.statement/db.system attributes instead of
# stable db.query.text.

# These two add the extra detail the demo used to wire up by hand with JdbcTelemetry:
# a span per getConnection(), and a span per COMMIT/ROLLBACK.
otel.instrumentation.jdbc-datasource.enabled=true
otel.instrumentation.jdbc.experimental.transaction.enabled=true

# --- Micrometer --------------------------------------------------------------------
# Off by default. This one flag enables two instrumentations: the Micrometer bridge
# itself, and the Spring Boot Actuator support that registers an OpenTelemetry
# MeterRegistry inside Spring's CompositeMeterRegistry. That second part is what makes
# the business metrics in the *MetricsAspect classes and the @Timed timers reach OTLP
# without any application code.
otel.instrumentation.micrometer.enabled=true

# --- GenAI -------------------------------------------------------------------------
# Spring AI 2.x calls OpenAI through the official com.openai:openai-java SDK, which the agent
# instruments out of the box — no configuration needed for that part. Every ChatClient call gets a
# `chat <model>` span with gen_ai.request.model, gen_ai.response.* and the input/output token
# counts.
#
# The prompts and completions themselves are opt-in — they are user content, and turning them on
# means shipping it to your backend. This is that switch.
#
# Where the content lands is worth knowing: not on the span, but as OTLP *log records* with
# event_name gen_ai.system.message / gen_ai.user.message / gen_ai.assistant.message /
# gen_ai.choice, each carrying the trace_id and span_id of the `chat` span. Open the span in
# Tempo and follow "Logs for this span", or query Loki directly:
#   {service_name="mystery-box-service"} | json | event_name=`gen_ai.user.message`
#
# Without this the events are still emitted, but with an empty body — so when you are checking
# whether it works, look at the body, not at the presence of the event.
otel.instrumentation.genai.capture-message-content=true

# --- HTTP --------------------------------------------------------------------------
# Adds http.server.active_requests, which the Grafana dashboard charts in-flight.
otel.instrumentation.http.server.emit-experimental-telemetry=true

# --- Export ------------------------------------------------------------------------
# Was management.otlp.metrics.export.step: 5s — keeps the dashboard responsive.
# The agent default is 60s.
otel.metric.export.interval=5s
