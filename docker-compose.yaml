services:
  postgres:
    image: postgres
    environment:
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"

  lgtm:
    image: grafana/otel-lgtm:0.24.0
    ports:
      - "3000:3000" # Grafana UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "3200:3200" # Tempo
      - "9090:9090" # Prometheus
      - "4040:4040" # Pyroscope
    volumes:
      - ./grafana/custom-dashboard.json:/otel-lgtm/grafana/conf/provisioning/dashboards/custom/custom-dashboard.json:ro
      - ./grafana/dashboards-provisioning.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/custom.yaml:ro
      - ./grafana/datasources.yaml:/otel-lgtm/grafana/conf/provisioning/datasources/grafana-datasources.yaml:ro
    environment:
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /otel-lgtm/grafana/conf/provisioning/dashboards/custom/custom-dashboard.json
      # Traces Drilldown isn't bundled in this image (only Logs and Metrics Drilldown are) — install
      # it explicitly so it shows up under the Drilldown menu next to those two.
      GF_INSTALL_PLUGINS: grafana-exploretraces-app

  otel-ebpf-profiler:
    image: otel/opentelemetry-collector-ebpf-profiler:latest
    command:
      - --config=/etc/ebpf-profiler-config.yaml
      - --feature-gates=service.profilesSupport
    hostname: ebpf-profiler
    privileged: true
    pid: "host"
    volumes:
      - ./grafana/otel-collector-config-profiling.yml:/etc/ebpf-profiler-config.yaml:ro
      - /sys/kernel/debug:/sys/kernel/debug:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro

  mcp-grafana:
    image: grafana/mcp-grafana:latest
    command:
      ["--transport", "streamable-http", "--address", "0.0.0.0:8888", "--debug"]
    ports:
      - "8888:8888"
    environment:
      GRAFANA_URL: http://lgtm:3000
      GRAFANA_USERNAME: admin
      GRAFANA_PASSWORD: admin
    depends_on:
      - lgtm

  # Both services are instrumented with zero code, and this file holds almost none of it. The
  # javaagent is downloaded into the image and attached by its ENTRYPOINT, together with the JVM
  # arguments that are fixed properties of the image — see each service's Dockerfile.
  #
  # What is left here is what actually differs per deployment:
  #   - otel-agent.properties, mounted read-only at /otel (edit + `docker compose restart`, no rebuild)
  #   - OTEL_EXPORTER_OTLP_ENDPOINT, because where telemetry goes is not a property of the image
  mystery-box-service:
    image: mystery-box-service
    ports:
      - "8081:8081"
    volumes:
      - ./otel-agent.properties:/otel/otel-agent.properties:ro
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: password
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
    depends_on:
      - postgres
      - lgtm

  order-service:
    image: order-service
    ports:
      - "8080:8080"
    volumes:
      - ./otel-agent.properties:/otel/otel-agent.properties:ro
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: password
      MYSTERY_BOX_SERVICE_URL: http://mystery-box-service:8081
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
    depends_on:
      - postgres
      - lgtm
      - mystery-box-service
