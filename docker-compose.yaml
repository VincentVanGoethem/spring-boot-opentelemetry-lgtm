services:
  ### APPLICATION
  order-service:
    image: tiffanyfay/spring-boot-order-service:${VERSION}
    # build:
    #   context: ./order-service
    ports:
      - "8080:8081"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT_GRPC}
      - OTEL_RESOURCE_ATTRIBUTES=service.name=order-service
      - OTEL_EXPORTER_OTLP_TRACES_PROTOCOL=grpc
      - OTEL_EXPORTER_OTLP_METRICS_PROTOCOL=grpc
      - OTEL_EXPORTER_OTLP_LOGS_PROTOCOL=grpc
      - OTEL_METRICS_EXPORTER=otlp,logging-otlp
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_JAVAAGENT_ENABLED=true
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DATABASE=${POSTGRES_DATABASE}
      - POSTGRES_USERNAME=${POSTGRES_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      - otelcol
      - postgres

  mystery-box-service:
    image: tiffanyfay/spring-boot-mystery-box-service:${VERSION}
    # build:
    #   context: ./mystery-box-service
    ports:
      - "8080:8082"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT_GRPC}
      - OTEL_RESOURCE_ATTRIBUTES=service.name=mystery-box-service
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OTEL_EXPORTER_OTLP_TRACES_PROTOCOL=grpc
      - OTEL_EXPORTER_OTLP_METRICS_PROTOCOL=grpc
      - OTEL_EXPORTER_OTLP_LOGS_PROTOCOL=grpc
      - OTEL_METRICS_EXPORTER=otlp,logging-otlp
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_JAVAAGENT_ENABLED=true
    depends_on:
      - otelcol

  postgres:
    image: "postgres:latest"
    environment:
      - POSTGRES_DB=${POSTGRES_DATABASE}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USERNAME}
    ports:
      - "5432:5432"

  ### OTEL

  otelcol:
    image: otel/opentelemetry-collector-contrib:0.147.0
    ports:
      - "4317:4317"
      - "4318:4318"
    privileged: true
    pid: "host"
    volumes:
      - ./config/otel-collector-config-lgtm.yml:/etc/otel-collector-config.yml
      - /sys/kernel/debug:/sys/kernel/debug:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    command:
      - --config=/etc/otel-collector-config.yml
      - --feature-gates=service.profilesSupport

  # otel-ebpf-profiler:
  #   image: otel/opentelemetry-collector-ebpf-profiler:0.147.0
  #   command:
  #     - --config=/etc/ebpf-profiler-config.yaml
  #     - --feature-gates=service.profilesSupport
  #   privileged: true
  #   pid: "host"
  #   volumes:
  #     - ./config/otel-collector-config-profiling.yml:/etc/ebpf-profiler-config.yaml:ro
  #     - /sys/kernel/debug:/sys/kernel/debug:ro
  #     - /sys/fs/cgroup:/sys/fs/cgroup:ro

  ### LGTM
  grafana:
    image: grafana/grafana:12.3.1
    volumes:
      - "./config/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml"
    #  - "./grafana:/etc/grafana/provisioning"
    ports:
      - "3000:3000"
    environment:
      - GF_FEATURE_TOGGLES_ENABLE=flameGraph traceqlSearch correlations traceQLStreaming metricsSummary traceqlEditor traceToMetrics traceToProfiles datatrails
      - GF_INSTALL_PLUGINS=grafana-lokiexplore-app,grafana-exploretraces-app,grafana-pyroscope-app
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true

  prometheus:
    image: quay.io/prometheus/prometheus
    command:
      - --web.console.templates=/etc/prometheus/consoles
      - --web.console.libraries=/etc/prometheus/console_libraries
      - --storage.tsdb.retention.time=1h
      - --config.file=/etc/prometheus/prometheus-config.yaml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
      - --web.enable-otlp-receiver
      - --web.enable-remote-write-receiver
      - --web.route-prefix=/
      - --enable-feature=exemplar-storage
      - --enable-feature=otlp-write-receiver
    volumes:
      - ./config/prometheus.yaml:/etc/prometheus/prometheus-config.yaml
    restart: unless-stopped
    ports:
      - "9090:9090"

  tempo:
    image: grafana/tempo:2.9.0
    ports:
      - "3200:3200"
      - "55680:55680"
      - "55681:55681"
      - "14250:14250"
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - "./config/tempo.yaml:/etc/tempo.yaml"

  loki:
    image: grafana/loki:3.6.3
    command:
      ["--pattern-ingester.enabled=true", "-config.file=/etc/loki/loki.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - "./config/loki.yaml:/etc/loki/loki.yaml"

  pyroscope:
    image: grafana/pyroscope:1.18.1
    command:
      - -self-profiling.disable-push=true
      - -config.file=/etc/pyroscope.yaml
    ports:
      - "4040:4040"
    volumes:
      - ./config/pyroscope.yaml:/etc/pyroscope.yaml:ro

  # pyroscope:
  #   image: grafana/pyroscope:1.16.2
  #   ports:
  #     - "4040:4040"
  #   command: ["server"]
