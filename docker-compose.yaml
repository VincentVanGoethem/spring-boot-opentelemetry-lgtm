services:
  postgres:
    image: postgres
    environment:
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"

  lgtm:
    image: grafana/otel-lgtm:latest
    command:
      - sh
      - -c
      - |
        echo '' >> /otel-lgtm/tempo-config.yaml
        echo 'query_frontend:' >> /otel-lgtm/tempo-config.yaml
        echo '  mcp_server:' >> /otel-lgtm/tempo-config.yaml
        echo '    enabled: true' >> /otel-lgtm/tempo-config.yaml
        cat /otel-lgtm/tempo-config.yaml
        exec /otel-lgtm/run-all.sh
    ports:
      - "3000:3000"   # Grafana UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "3200:3200"
    volumes:
      - ./grafana/custom-dashboard.json:/otel-lgtm/grafana/conf/provisioning/dashboards/custom/custom-custom-dashboard.json:ro
      - ./grafana/dashboards-provisioning.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/custom.yaml:ro
    environment:
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /otel-lgtm/grafana/conf/provisioning/dashboards/custom/custom-custom-dashboard.json

  mcp-grafana:
    image: grafana/mcp-grafana:latest
    ports:
      - "8000:8000"
    environment:
      GRAFANA_URL: http://lgtm:3000
      GRAFANA_EXTRA_HEADERS: '{"Authorization": "Basic YWRtaW46YWRtaW4="}'
    depends_on:
      - lgtm