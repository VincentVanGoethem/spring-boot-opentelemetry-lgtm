services:
  postgres:
    image: postgres
    environment:
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"

  lgtm:
    image: grafana/otel-lgtm:0.24.0
    ports:
      - "3000:3000"   # Grafana UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "3200:3200"
    volumes:
      - ./grafana/custom-dashboard.json:/otel-lgtm/grafana/conf/provisioning/dashboards/custom/custom-custom-dashboard.json:ro
      - ./grafana/dashboards-provisioning.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/custom.yaml:ro
      - ./grafana/datasources.yaml:/otel-lgtm/grafana/conf/provisioning/datasources/custom-datasources.yaml:ro
    environment:
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /otel-lgtm/grafana/conf/provisioning/dashboards/custom/custom-custom-dashboard.json

  mcp-grafana:
    image: grafana/mcp-grafana:latest
    command: ["--transport", "streamable-http", "--address", "0.0.0.0:8888", "--debug"]
    ports:
      - "8888:8888"
    environment:
      GRAFANA_URL: http://lgtm:3000
      GRAFANA_USERNAME: admin
      GRAFANA_PASSWORD: admin
    depends_on:
      - lgtm

  mystery-box-service:
    image: mystery-box-service
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: password
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://lgtm:4318/v1/traces
      MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT: http://lgtm:4318/v1/logs
      MANAGEMENT_OTLP_METRICS_EXPORT_URL: http://lgtm:4318/v1/metrics
    depends_on:
      - postgres
      - lgtm

  order-service:
    image: order-service
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: password
      MYSTERY_BOX_SERVICE_URL: http://mystery-box-service:8081
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://lgtm:4318/v1/traces
      MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT: http://lgtm:4318/v1/logs
      MANAGEMENT_OTLP_METRICS_EXPORT_URL: http://lgtm:4318/v1/metrics
    depends_on:
      - postgres
      - lgtm
      - mystery-box-service